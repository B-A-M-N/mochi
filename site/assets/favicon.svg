<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" >
  <defs>
    <!-- Background soft puddle glow -->
    <radialGradient id="puddleGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#DDD6FE" stop-opacity="0.95"/>
      <stop offset="70%" stop-color="#C4B5FD" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#A78BFA" stop-opacity="0"/>
    </radialGradient>
    <!-- Mochi Body Soft Radial Shading -->
    <radialGradient id="mochiBody" cx="46%" cy="36%" r="62%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="65%" stop-color="#FAF5FF"/>
      <stop offset="100%" stop-color="#EDE9FE"/>
    </radialGradient>
    <!-- Left Leaf Gradient (Vibrant Violet) -->
    <linearGradient id="leafGradL" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6D28D9"/>
      <stop offset="50%" stop-color="#7C3AED"/>
      <stop offset="100%" stop-color="#8B5CF6"/>
    </linearGradient>
    <!-- Right Leaf Gradient (Lighter Lavender) -->
    <linearGradient id="leafGradR" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7C3AED"/>
      <stop offset="50%" stop-color="#8B5CF6"/>
      <stop offset="100%" stop-color="#A78BFA"/>
    </linearGradient>
    <!-- Ambient Depth Shadow -->
    <filter id="glowShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2.5" stdDeviation="3" flood-color="#7C3AED" flood-opacity="0.22"/>
    </filter>
  </defs>

  <!-- Ground Puddle / Shadow -->
  <ellipse cx="64" cy="102" rx="50" ry="14" fill="url(#puddleGlow)"/>

  <!-- Top Leaves Sprout -->
  <!-- Left Leaf (Primary Up-Left) -->
  <path d="M59 50 C55 30 38 18 34 20 C32 35 46 48 58 51 Z" fill="url(#leafGradL)" filter="url(#glowShadow)"/>
  <path d="M39 26 C44 34 50 42 57 48" stroke="#5B21B6" stroke-width="1.8" stroke-linecap="round" fill="none"/>

  <!-- Right Leaf (Secondary Up-Right) -->
  <path d="M57 51 C66 34 84 27 87 29 C86 45 70 54 59 51 Z" fill="url(#leafGradR)" filter="url(#glowShadow)"/>
  <path d="M81 35 C75 41 68 46 60 50" stroke="#6D28D9" stroke-width="1.8" stroke-linecap="round" fill="none"/>

  <!-- Main Mochi Slime Dome Body -->
  <path d="M20 86 C15 62 32 44 64 44 C96 44 113 62 108 86 C103 101 84 102 64 102 C44 102 25 101 20 86 Z" 
        fill="url(#mochiBody)" 
        stroke="#C4B5FD" 
        stroke-width="2.4" 
        stroke-linejoin="round" 
        filter="url(#glowShadow)"/>

  <!-- Left Eye -->
  <ellipse cx="46" cy="73" rx="8" ry="11.5" fill="#18181B" transform="rotate(-4 46 73)"/>
  <!-- Left Eye Specular Highlight -->
  <circle cx="44" cy="68.5" r="3.4" fill="#FFFFFF"/>

  <!-- Right Eye -->
  <ellipse cx="78" cy="74" rx="8" ry="11.5" fill="#18181B" transform="rotate(4 78 74)"/>
  <!-- Right Eye Specular Highlight -->
  <circle cx="75.5" cy="69.5" r="3.4" fill="#FFFFFF"/>

  <!-- Soft Kawaii Blush Cheeks -->
  <ellipse cx="33" cy="83" rx="7.5" ry="4.8" fill="#F472B6" opacity="0.82"/>
  <ellipse cx="91" cy="84" rx="7.5" ry="4.8" fill="#F472B6" opacity="0.82"/>

  <!-- Cute Purple Magic Sparkles -->
  <!-- Left Sparkle -->
  <path d="M13 60 L15.5 64.5 L20 67 L15.5 69.5 L13 74 L10.5 69.5 L6 67 L10.5 64.5 Z" fill="#8B5CF6" opacity="0.9"/>
  <!-- Right Sparkle -->
  <path d="M107 46 L109 49.5 L112.5 51.5 L109 53.5 L107 57 L105 53.5 L101.5 51.5 L105 49.5 Z" fill="#A855F7" opacity="0.85"/>
  <!-- Top Tiny Accent -->
  <circle cx="98" cy="33" r="2" fill="#C084FC" opacity="0.75"/>
</svg>