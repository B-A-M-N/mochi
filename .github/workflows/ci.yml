name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Push-cadence runs cancel each other (cancel-in-progress), which repeatedly
# killed the slow Windows leg before it finished. Manual runs get their own
# group so a dispatched run survives new pushes — it is the only way to get
# that leg to a verdict.
concurrency:
  group: ci-${{ github.event_name == 'workflow_dispatch' && 'manual' || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # package.json declares engines.node >= 22; test on latest LTS.
        node: [22]
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      # GH runner images do NOT ship bun (prepack's build:bin needs it —
      # ubuntu died at "sh: 1: bun: not found" during the tarball verify).
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: npm ci

      - name: Build native accelerators (Rust + C++) so parity tests run
        # git-bash on Windows so `command -v` + POSIX paths work unchanged.
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            # MSVC links N-API symbols against node.lib at build time (see
            # build.rs). Toolcache node ships WITHOUT node.lib — fetch the
            # single import library directly from the official dist for the
            # EXACT node version (same ABI; this is the URL node-gyp itself
            # uses). No zip, no PowerShell: one curl, verified size.
            set +e
            NODE_VERSION="$(node -v)"
            mkdir -p /tmp/node-lib
            curl -fsSL "https://nodejs.org/dist/${NODE_VERSION}/win-x64/node.lib" -o /tmp/node-lib/node.lib
            echo "win: node.lib fetch exit $? ($(wc -c < /tmp/node-lib/node.lib 2>/dev/null) bytes)"
            if [ -s /tmp/node-lib/node.lib ]; then
              export MOCHI_NODE_LIB_DIR="$(cygpath -m /tmp/node-lib)"
            fi
            echo "win preflight: MOCHI_NODE_LIB_DIR=${MOCHI_NODE_LIB_DIR:-<unset>}"
            set -e
          fi
          if command -v rustc >/dev/null 2>&1 && command -v g++ >/dev/null 2>&1; then
            npm run build:native
            # Fail loudly if the build silently no-op'd: build:native uses
            # `|| true` per-tool, so a broken accelerator used to pass CI
            # with parity tests self-skipping. Any missing binary is a bug.
            missing=0
            # Windows emits `.exe` variants of the same names.
            for bin in native/bin/mochi-agent native/bin/mochi_core.node native/bin/fuzzy_rust native/bin/search_rust native/bin/fuzzy_cpp; do
              if [ ! -f "$bin" ] && [ ! -f "$bin.exe" ]; then echo "native binary missing after build: $bin"; missing=1; fi
            done
            [ "$missing" -eq 0 ] || exit 1
            echo "native binaries OK"
          else
            echo "toolchain missing; native parity tests will self-skip"
          fi

      # ── Lint gate (MCH-13/MCH-23): no unused locals/params, strict types ──
      - name: Typecheck (strict — noUnusedLocals enforced)
        run: npx tsc -p tsconfig.json --noEmit

      - name: Skip-budget guard (no silent test-scope shrink)
        run: node scripts/check-skips.mjs

      - name: Dependency audit (shipped surface must be clean)
        # Full `npm audit` includes dev-only vitest/vite advisories whose fix
        # is a breaking vitest 5 bump (tracked separately); the SHIPPED agent
        # is zero-dependency, so the production surface must audit clean.
        run: npm audit --omit=dev --audit-level=moderate

      # ── Tests with coverage (MCH-23) ──
      # Coverage thresholds are a RATCHET, not an aspiration: measured
      # 65.57% lines / 70.2% funcs on 2026-10-12 (the previous 70/70 had
      # never been green — it masked real test failures behind it for
      # weeks). Raise these when coverage rises; never lower silently.
      - name: Tests
        run: npx vitest run --coverage --coverage.reporter=text --coverage.thresholds.lines=65 --coverage.thresholds.functions=69
        continue-on-error: false

      - name: Build
        run: npm run build

      - name: Verify the npm tarball ships runtime files (not raw source)
        # Guard against the distributability regression: dist/ and native/bin
        # are gitignored, so without a "files" whitelist npm would exclude them
        # and ship raw src/*.ts instead, breaking main/bin/exports on install.
        if: matrix.os == 'ubuntu-latest'
        run: |
          # prepack's own logs (sync-version, bun compile) share stdout with
          # npm's final filename line — extract the filename instead of
          # capturing raw output (a bare capture made tar choke on the logs).
          pack_out=$(npm pack --silent --pack-destination "$RUNNER_TEMP") || { echo "npm pack failed"; exit 1; }
          echo "$pack_out"
          tar=$(printf '%s\n' "$pack_out" | grep -oE '[A-Za-z0-9._-]+\.tgz' | tail -n 1)
          [ -n "$tar" ] || { echo "no tarball filename in npm pack output"; exit 1; }
          echo "tarball: $tar"
          tar -tzf "$RUNNER_TEMP/$tar" > /tmp/tar-contents.txt
          grep -q 'package/dist/cli.js' /tmp/tar-contents.txt || { echo "dist/cli.js missing"; exit 1; }
          grep -q 'package/dist/index.js' /tmp/tar-contents.txt || { echo "dist/index.js missing"; exit 1; }
          grep -q 'package/native/bin/mochi_core.node' /tmp/tar-contents.txt || { echo "native/bin missing"; exit 1; }
          if grep -q 'package/src/.*\.ts' /tmp/tar-contents.txt; then echo "raw src/ leaked into tarball"; exit 1; fi
          if grep -q '\.test\.ts' /tmp/tar-contents.txt; then echo "test files leaked into tarball"; exit 1; fi
          echo "tarball contents OK"

      - name: Memory regression gate
        run: npm run bench:memory

      # ── Speculation bench (MCH-21): branch-racer kill-rate ──
      - name: Speculation bench (branch-racer kill-rate)
        run: |
          if npm run | grep -q 'bench:speculation'; then
            npm run bench:speculation
          else
            echo "bench:speculation not yet configured — skip"
          fi
        continue-on-error: true

      - name: Smoke test the CLI
        # git-bash on Windows: needs `head` + /dev/null (absent in pwsh).
        shell: bash
        run: |
          node dist/cli.js --version
          node dist/cli.js --help | head -5
          # Non-TTY with no prompt must print help, not launch the TUI.
          out=$(node dist/cli.js < /dev/null | head -1) || true
          case "$out" in
            Mochi*|Usage*) echo "CLI smoke OK" ;;
            *) echo "Unexpected CLI output: $out"; exit 1 ;;
          esac
